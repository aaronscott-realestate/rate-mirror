name: Update rates

on:
  schedule:
    - cron: '20 13 * * 1-5'
    - cron: '20 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest rates from FRED
        run: node scripts/update-rates.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Save if changed
        run: |
          git config user.name "rate-mirror-bot"
          git config user.email "rate-mirror-bot@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || (git commit -m "Update rates" && git push)
